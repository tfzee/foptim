config_version = 1

# ------------------------------------------------------------------------------------------------
# Target setup

[target]
name = "x86_64-linux"

[target.features]
avx512f = false
avx512bw = false
avx512cd = false
avx512dq = false
avx512vl = false
avx512vpopcntdq = false
avx512bitalg = false
avx512vbmi = false
avx512ifma = false
avxvnni = false
bmi2 = true

# ------------------------------------------------------------------------------------------------
# Optimizations

[optimize]
fir_pipeline = "default_release"
mir_pipeline = "default_release"
# makes everything interal if possible
all_linkage_internal = false
# assumes that calls to functions named like strlen and other cstdlib function
# beheave like in the cstdlib
assume_cstdlib_beheaviour = true

[optimize.float]
no_nans = false
no_infinites = false
associative_math = false
reciprocal_math = false
no_signed_zeros = false
no_math_errno = false
no_trapping_math = false
#equiv of fno-rounding-math
no_rounding_mode = false
#equiv to ffp-contract=fast
fast_contract = false
#equiv to fapprox-func
approx_func = false

# ------------------------------------------------------------------------------------------------
# FIR Pipeline

[pipeline.fir.default_release_early]
passes = [
        "DCE", "LLVMIntrinsicLowering", "IntrinSimplify", "SORA", "Mem2Reg",
        "DCE", "IntrinSimplify", "InstSimplify", "DCE", "SimplifyCFG", "LVN", "DSE", "DCE",
        "FuncPropAnnotator", "GlobalPromotion", "ArgPromotion", "GDCE", "EarlySheduler",
        "DCE", "CmpKnownValProp", "ConstraintProp", "SimplifyCFG", "TailRecElim", "LICM", "LoopRotate",
        "SimplifyCFG", "DCE", "IntrinConv",
]

[pipeline.fir.default_release_middle]
passes = [
      "DCE", "CmpKnownValProp", "SimplifyCFG", "TailRecElim", "LICM", "LoopRotate",
      "LoopSimplify", "SimplifyCFG", "DCE", "LVN", "SCCP", "IntrinSimplify", "InstSimplify",
      "DCE", "SimplifyCFG", "StackKnownBits", "SORA", "Mem2Reg",
      "SimplifyCFG", "DCE", "LVN", "InstSimplify", "ConstLoopEval", "LoopSimplify",
      "InstSimplify", "SimplifyCFG", "FuncPropAnnotator", "IPCP", "GlobalPromotion", "Inline",
      "ArgPromotion", "GDCE", "FunctionDedupSame", "GDCE", "FuncPropAnnotator", "SimplifyCFG", "CmpKnownValProp", "ConstraintProp",
      "InstSimplify", "SimplifyCFG", "LICM", "DCE", "LoopSimplify", "LoopUnswitch", "IntrinConv", "DCE", "SLPVectorizer", "LoopUnroll", "SimplifyCFG", "DCE", "SLPVectorizer",
      "LVN", "SCCP", "IntrinSimplify", "InstSimplify", "ConstLoopEval", "InstSimplify",
      "CmpKnownValProp", "SimplifyCFG", "DCE","FuncPropAnnotator", "IPCP", "GlobalPromotion", "Inline",
      "ArgPromotion", "FunctionDedupSame", "GDCE", "FuncPropAnnotator", "SimplifyCFG", "InstSimplify",
      "SimplifyCFG", "TailRecElim", "SimplifyCFG", "DCE", "LoopSimplify", "LoopUnswitch", "IntrinSimplify", "InstSimplify", "DCE",
      "StackKnownBits", "SORA", "Mem2Reg", "SimplifyCFG", "DSE", "DCE",
      "ArgPromotion", "FuncPropAnnotator", "FunctionDedupDiff", "GDCE", "IPCP",
      "GlobalPromotion", "Inline", "GDCE", "FuncPropAnnotator",
      "SimplifyCFG", "DCE",
]

[pipeline.fir.default_release_late]
passes = [
      "LVN", "SCCP", "DSE", "DCE", "IntrinSimplify", "InstSimplify",
      "CmpKnownValProp", "ConstraintProp", "SimplifyCFG", "SCCP",
      "ArgPromotion", "FuncPropAnnotator", "FunctionDedupDiff", "PartialInlineSplit", "LateInline", "GDCE", "IPCP", "FuncPropAnnotator", "SORA", "Mem2Reg",
      "SimplifyCFG", "LVN", "SCCP", "DCE", "IntrinSimplify", "SimplifyCFG",
      "InstSimplify", "SCCP", "DCE", "InstSimplify", "ConstLoopEval", "LoopSimplify",
      "LoopRotate", "SimplifyCFG", "LoopUnswitch", "DSE", "DCE", "IntrinConv", "DCE", "SLPVectorizer", "LoopUnroll", "SimplifyCFG", "DCE", "SLPVectorizer", "InstSimplify",
      "SimplifyCFG",
      "ArgPromotion", "FuncPropAnnotator", "FunctionDedupDiff", "LateInline",
      "GDCE", "IPCP", "FuncPropAnnotator", "SORA", "Mem2Reg",
      "SimplifyCFG", "LVN", "SCCP", "DCE", "IntrinSimplify", "InstSimplify", "DCE",
      "IntrinConv", "DCE", "SLPVectorizer", "InstSimplify", "SimplifyCFG",
      "LegalizeVecs", "SCCP", "LVN", "InstSimplify", "DCE", "LVN", "InstSimplify", "DCE",  
      "IntrinSimplify", "SimplifyCFG", "DCE",
]

[pipeline.fir.default_release_cleanup_round]
passes = [
  "InstSimplify", "LVN", "InstSimplify", "SCCP", "SimplifyCFG", "DCE", "LICM", "SORA",
  "Mem2Reg", "InstSimplify", "LVN", "SCCP", "SimplifyCFG", "DCE", "DSE",
  "LoopSimplify", "InstSimplify", "SimplifyCFG", "DCE",
]

[pipeline.fir.default_release_cleanup]
passes = [
  "LegalizeInts",
  "pipeline:default_release_cleanup_round", "pipeline:default_release_cleanup_round",
  "pipeline:default_release_cleanup_round", "pipeline:default_release_cleanup_round",
  "MergeAlloca", "EarlySheduler", "LVN", "InstSimplify", "SCCP", "DCE", "LVN",
  "InstSimplify", "SimplifyCFG", "DCE", "LegalizeVecs", "InstSimplify",
  "SCCP", "LegalizeVecs", "DCE", "IntrinConv", "DCE", "IntrinLowerCalls", "IntrinExpand", "SimplifyCFG", "DCE",
]

[pipeline.fir.default_release]
passes = [
  "pipeline:default_release_early",
  "pipeline:default_release_middle",
  "pipeline:default_release_late",
  "pipeline:default_release_cleanup",
]

# ------------------------------------------------------------------------------------------------
# FIR Passes

#module
[pass.fir.LateInline]
extends = "Inline"
allow_recursive = true
allow_builtins = true
[pass.fir.Inline]
allow_recursive = true
allow_builtins = false
[pass.fir.LegalizeInts]
[pass.fir.PartialInlineSplit]
rest_min = 40
prefix_max = 16
max_live_ins = 8
[pass.fir.FuncPropAnnotator]
[pass.fir.GlobalPromotion]
[pass.fir.ArgPromotion]
[pass.fir.GDCE]
[pass.fir.IPCP]
[pass.fir.FunctionDedupSame]
[pass.fir.FunctionDedupDiff]
[pass.fir.PrintModule]
# [pass.VerifyModule]

#func
[pass.fir.LoopUnswitch]
[pass.fir.LoopUnroll]
maxUnroll = 32
maxInstr = 32
maxFullUnroll = 8
maxFullInstr = 256
[pass.fir.SLPVectorizer]
reductions = true
loops = true
# 0 = only the target decides
maxVF = 0
# trip count of the loop cost model when it is not a constant
assumedTrip = 64
[pass.fir.DCE]
[pass.fir.LLVMIntrinsicLowering]
[pass.fir.SORA]
[pass.fir.Mem2Reg]
[pass.fir.IntrinSimplify]
[pass.fir.InstFold]
[pass.fir.InstSimplify]
[pass.fir.SimplifyCFG]
[pass.fir.LVN]
[pass.fir.EarlySheduler]
[pass.fir.ConstraintProp]
[pass.fir.CmpKnownValProp]
[pass.fir.TailRecElim]
[pass.fir.LICM]
[pass.fir.LoopRotate]
[pass.fir.LoopSimplify]
[pass.fir.SCCP]
[pass.fir.StackKnownBits]
[pass.fir.ConstLoopEval]
[pass.fir.MergeAlloca]
[pass.fir.DSE]
[pass.fir.IntrinConv]
[pass.fir.IntrinExpand]
[pass.fir.IntrinLowerCalls]
[pass.fir.LegalizeVecs]
[pass.fir.PrintAnalysis]
#   memssa      memory SSA and the clobber of every load
#   accesses    every load / store / barrier with its decoded address
#   provenance  stack / global / null / escape facts of the pointer values
#   alias       alias answer of every pair of accesses, mod/ref of the barriers
show = []
[pass.fir.PrintFunc]
name_matching = ""
[pass.fir.VerifyFunc]


# ------------------------------------------------------------------------------------------------
# MIR Pipeline
[pipeline.mir.default_release_early]
passes = [
  "LegalizeBBForm",
  "DCE",
  "CopyPropagation",
  "DCE",
]

[pipeline.mir.default_release_middle]
passes = [
  "LVN",
  "CopyPropagation",
  "LVN",
  "DCE",
  "InstSimplifyEarly",
  "LifetimeShortening",
  "CopyPropagation",
  "InstSimplifyEarly",
  "DCE",
]

[pipeline.mir.default_release_CC1]
passes = [
  "CallingConv_FirstStage",
  "Legalizer",
  "InstSimplifyEarly",
  # "RegisterJoining",
  "InstSimplifyEarly",
]

[pipeline.mir.default_release_RegAlloc]
passes = [
  "RegAlloc",
]

[pipeline.mir.default_release_CC2]
passes = [
  "CallingConv_SecondStage",
]

[pipeline.mir.default_release_Cleanup]
passes = [
  "StackSlotLowering",
  "StackOptim",
  "InstSimplify",
  "InstSimplify",
  "BBReordering",
]

[pipeline.mir.default_release]
passes = [
 "pipeline:default_release_early",
 "pipeline:default_release_middle",
 "pipeline:default_release_CC1",
 "pipeline:default_release_RegAlloc",
 "pipeline:default_release_CC2",
 "pipeline:default_release_Cleanup",
]

# ------------------------------------------------------------------------------------------------
# MIR Passes

# func
[pass.mir.LegalizeBBForm]
[pass.mir.DCE]
[pass.mir.CopyPropagation]
[pass.mir.BBReordering]
[pass.mir.LVN]
[pass.mir.InstSimplifyEarly]
[pass.mir.InstSimplify]
[pass.mir.LifetimeShortening]
[pass.mir.CallingConv_FirstStage]
[pass.mir.Legalizer]
[pass.mir.RegisterJoining]
[pass.mir.RegAlloc]
[pass.mir.CallingConv_SecondStage]
[pass.mir.StackSlotLowering]
[pass.mir.StackOptim]


# ------------------------------------------------------------------------------------------------
# Debug

[debug]
print_between_passes = false
print_optimization_failure_reasons = true
print_color = true
verify_between_passes = false
time_passes = false
bisect = -1
verbosity = 0

